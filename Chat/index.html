<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ===== Header ===== */
        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            background: #128c7e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        .chat-header .info {
            flex: 1;
        }
        .chat-header .info h3 {
            font-size: 16px;
            margin-bottom: 2px;
        }
        .chat-header .info span {
            font-size: 12px;
            opacity: 0.8;
        }
        .chat-header .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .chat-header .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* ===== Messages Area ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #b7b7b7;
            border-radius: 10px;
        }
        
        /* ===== Message Bubbles ===== */
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message .msg-user {
            font-size: 12px;
            font-weight: bold;
            color: #075e54;
            margin-bottom: 3px;
        }
        .message .msg-text {
            font-size: 14px;
            line-height: 1.5;
        }
        .message .msg-time {
            font-size: 10px;
            color: #999;
            text-align: left;
            margin-top: 4px;
        }
        
        /* پیام‌های خودم (چپ) */
        .message.my-message {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }
        .message.my-message .msg-user {
            color: #075e54;
        }
        
        /* پیام‌های دیگران (راست) */
        .message.other-message {
            background: white;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .message.other-message .msg-user {
            color: #128c7e;
        }
        
        /* ===== Input Area ===== */
        .input-area {
            background: #f0f0f0;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .input-area input:focus {
            box-shadow: 0 0 0 2px #075e54;
        }
        .input-area button {
            background: #075e54;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-area button:hover {
            background: #128c7e;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ===== Login Screen ===== */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #075e54;
            color: white;
            padding: 30px;
        }
        .login-screen h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .login-screen p {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .login-screen input {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .login-screen input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
        }
        .login-screen button {
            margin-top: 15px;
            background: #128c7e;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-screen button:hover {
            background: #0d6e63;
        }
        .login-error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
        }
        
        /* ===== Hidden ===== */
        .hidden {
            display: none !important;
        }
        
        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container" id="app">
        
        <!-- ===== Login Screen ===== -->
        <div class="login-screen" id="loginScreen">
            <h2>💬 چت</h2>
            <p>برای شروع نام خود را وارد کنید</p>
            <input type="text" id="nameInput" placeholder="نام شما..." maxlength="30">
            <button onclick="login()">ورود به چت</button>
            <div class="login-error" id="loginError"></div>
        </div>
        
        <!-- ===== Chat Interface ===== -->
        <div id="chatInterface" class="hidden" style="display:flex;flex-direction:column;height:100%;">
            
            <!-- Header -->
            <div class="chat-header">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="info">
                    <h3 id="displayName">کاربر</h3>
                    <span id="onlineStatus">آنلاین</span>
                </div>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
            
            <!-- Messages -->
            <div class="messages-area" id="messagesArea">
                <!-- پیام‌ها اینجا می‌آیند -->
            </div>
            
            <!-- Input -->
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." 
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <script>
        // ====== متغیرها ======
        let currentUser = '';
        let messageInterval = null;
        const messagesArea = document.getElementById('messagesArea');
        
        // ====== ورود ======
        window.login = function() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            const error = document.getElementById('loginError');
            
            if (!name || name.length < 2) {
                error.textContent = 'لطفاً نام معتبر وارد کنید (حداقل ۲ حرف)';
                return;
            }
            
            error.textContent = '';
            
            // ذخیره نام کاربر
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        currentUser = name;
                        document.getElementById('displayName').textContent = name;
                        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('chatInterface').style.display = 'flex';
                        document.getElementById('messageInput').focus();
                        loadMessages();
                        // هر ۳ ثانیه پیام‌ها رو چک کن
                        if (messageInterval) clearInterval(messageInterval);
                        messageInterval = setInterval(loadMessages, 3000);
                    } else {
                        error.textContent = 'خطا در ثبت نام: ' + result.message;
                    }
                })
                .withFailureHandler(function(err) {
                    error.textContent = 'خطا در ارتباط با سرور';
                    console.error(err);
                })
                .saveUser(name);
        };
        
        // ====== خروج ======
        window.logout = function() {
            if (messageInterval) {
                clearInterval(messageInterval);
                messageInterval = null;
            }
            currentUser = '';
            document.getElementById('chatInterface').style.display = 'none';
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('nameInput').value = '';
            document.getElementById('nameInput').focus();
        };
        
        // ====== ارسال پیام ======
        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentUser) return;
            
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        input.value = '';
                        loadMessages();
                    } else {
                        alert('خطا در ارسال پیام: ' + result.message);
                    }
                    btn.disabled = false;
                    input.focus();
                })
                .withFailureHandler(function(err) {
                    alert('خطا در ارتباط با سرور');
                    btn.disabled = false;
                })
                .saveMessage(currentUser, message);
        };
        
        // ====== دریافت و نمایش پیام‌ها ======
        window.loadMessages = function() {
            google.script.run
                .withSuccessHandler(function(messages) {
                    renderMessages(messages);
                })
                .withFailureHandler(function(err) {
                    console.error('خطا در دریافت پیام‌ها:', err);
                })
                .getMessages();
        };
        
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                messagesArea.innerHTML = `
                    <div style="text-align:center;color:#999;margin-top:30px;font-size:14px;">
                        🗨️ هنوز پیامی ارسال نشده است<br>
                        <span style="font-size:12px;">اولین پیام را شما بفرستید!</span>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let lastUser = '';
            
            messages.forEach((msg, index) => {
                const isMyMessage = (msg.userName === currentUser);
                const showUser = (msg.userName !== lastUser);
                lastUser = msg.userName;
                
                html += `
                    <div class="message ${isMyMessage ? 'my-message' : 'other-message'}">
                        ${!isMyMessage && showUser ? `<div class="msg-user">${msg.userName}</div>` : ''}
                        <div class="msg-text">${escapeHtml(msg.message)}</div>
                        <div class="msg-time">${msg.timestamp || ''}</div>
                    </div>
                `;
            });
            
            messagesArea.innerHTML = html;
            // اسکرول به پایین
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        
        // ====== امنیت: جلوگیری از XSS ======
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ====== ورود با Enter ======
        document.getElementById('nameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
