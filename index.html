<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت عمومی تلگرامی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: #0e1621;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Modal برای دریافت نام کاربری */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 22, 33, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-box {
      background: #17212b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 360px;
    }

    .login-box h2 {
      margin-bottom: 15px;
      color: #5288c1;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #242f3d;
      background: #242f3d;
      color: #fff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      text-align: center;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #5288c1;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .login-box button:hover {
      background: #4170a2;
    }

    /* کانتینر اصلی چت */
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #0e1621;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    /* هدر چت */
    .chat-header {
      background: #17212b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #101921;
      z-index: 10;
    }

    .chat-header .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5288c1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .chat-header .title-details h3 {
      font-size: 16px;
      color: #fff;
    }

    .chat-header .title-details p {
      font-size: 12px;
      color: #7f91a4;
    }

    .update-btn {
      background: transparent;
      border: none;
      color: #5288c1;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .update-btn:hover {
      background: rgba(82, 136, 193, 0.1);
    }

    .update-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* بدنه چت (محل نمایش پیام‌ها) */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-image: radial-gradient(#17212b 1px, transparent 0);
      background-size: 16px 16px;
      background-position: -19px -19px;
    }

    /* ساختار پیام‌ها */
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
    }

    .message.outgoing {
      align-self: flex-start; /* جهت راست برای فارسی */
      background: #2b5278;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.incoming {
      align-self: flex-end; /* جهت چپ برای بقیه کاربران */
      background: #182533;
      color: #fff;
      border-bottom-left-radius: 2px;
    }

    .message .username {
      font-size: 12px;
      font-weight: bold;
      color: #ee6a5d;
      margin-bottom: 3px;
    }

    .message.outgoing .username {
      color: #64b5f6;
    }

    .message .text {
      margin-bottom: 4px;
      white-space: pre-wrap;
    }

    .message .time {
      font-size: 10px;
      color: #7f91a4;
      align-self: flex-end;
      margin-top: 2px;
    }

    /* بخش ارسال پیام */
    .chat-input-area {
      background: #17212b;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: #0e1621;
      border: 1px solid #242f3d;
      padding: 12px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background: #5288c1;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #4170a2;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transform: rotate(180deg);
    }

    /* لودینگ */
    .loading-spinner {
      text-align: center;
      color: #7f91a4;
      font-size: 13px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <!-- پنجره دریافت نام کاربری -->
  <div class="login-modal" id="loginModal">
    <div class="login-box">
      <h2>ورود به چت</h2>
      <p style="color: #7f91a4; font-size: 13px; margin-bottom: 15px;">لطفاً نام کاربری خود را وارد کنید:</p>
      <input type="text" id="usernameInput" placeholder="نام شما..." maxlength="20" autofocus>
      <button onclick="startChat()">ورود به برنامه</button>
    </div>
  </div>

  <!-- برنامه اصلی چت -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="user-info">
        <div class="avatar" id="headerAvatar">G</div>
        <div class="title-details">
          <h3>گروه چت عمومی</h3>
          <p id="currentUserDisplay">درحال دریافت...</p>
        </div>
      </div>
      <button class="update-btn" onclick="fetchMessages()" title="بروزرسانی پیام‌ها">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="loading-spinner" id="loadingText">در حال دریافت پیام‌ها...</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrqOK0z97ZQmee7DEh0P5hWahw6VumgixKizSFV-8gZujQLceNTyn5cu6yY1q_d9A3/exec";
    
    let currentUsername = "";
    let lastMessagesCount = 0;

    function startChat() {
      const name = document.getElementById("usernameInput").value.trim();
      if (!name) {
        alert("لطفاً یک نام کاربری وارد کنید!");
        return;
      }
      currentUsername = name;
      document.getElementById("loginModal").style.display = "none";
      document.getElementById("currentUserDisplay").innerText = "کاربر: " + currentUsername;
      document.getElementById("headerAvatar").innerText = currentUsername.charAt(0).toUpperCase();

      fetchMessages();
      // بروزرسانی خودکار هر ۳ ثانیه
      setInterval(fetchMessages, 3000);
    }

    function fetchMessages() {
      fetch(`${SCRIPT_URL}?action=getMessages`)
        .then(response => response.json())
        .then(data => {
          if (data.status === "success") {
            renderMessages(data.messages);
          }
        })
        .catch(error => console.error("Error fetching messages:", error));
    }

    function renderMessages(messages) {
      const container = document.getElementById("chatMessages");
      container.innerHTML = "";

      if (messages.length === 0) {
        container.innerHTML = '<div class="loading-spinner">هنوز پیامی ارسال نشده است.</div>';
        return;
      }

      messages.forEach(msg => {
        const isSelf = msg.username === currentUsername;
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${isSelf ? 'outgoing' : 'incoming'}`;

        msgDiv.innerHTML = `
          <span class="username">${escapeHtml(msg.username)}</span>
          <span class="text">${escapeHtml(msg.message)}</span>
          <span class="time">${escapeHtml(msg.timestamp)}</span>
        `;

        container.appendChild(msgDiv);
      });

      // اسکرول هوشمند به انتهای صفحه (جدیدترین پیام‌ها در پایین)
      if (messages.length !== lastMessagesCount) {
        container.scrollTop = container.scrollHeight;
        lastMessagesCount = messages.length;
      }
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !currentUsername) return;

      input.value = "";

      const url = `${SCRIPT_URL}?action=sendMessage&username=${encodeURIComponent(currentUsername)}&message=${encodeURIComponent(text)}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.status === "success") {
            fetchMessages();
          } else {
            alert("خطا در ارسال پیام!");
          }
        })
        .catch(error => console.error("Error sending message:", error));
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
