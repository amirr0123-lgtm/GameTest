<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادداشت‌های گیت‌هاب</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; resize: vertical; }
        button { background: #2ea44f; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { opacity: 0.6; }
        .note-item { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-right: 4px solid #2ea44f; }
        .note-time { font-size: 12px; color: #666; margin-top: 5px; }
        #loading { text-align: center; color: #666; padding: 10px; display: none; }
        #history { margin-top: 15px; }
        #tokenStatus { color: #666; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 یادداشت جدید</h2>
        <textarea id="noteInput" placeholder="متن یادداشت رو اینجا بنویس..."></textarea>
        <button id="saveBtn">💾 ذخیره در گیت‌هاب</button>
        <div id="loading">⏳ در حال ذخیره‌سازی...</div>
        <div id="tokenStatus"></div>
    </div>

    <div class="card">
        <h2>📜 تاریخچه یادداشت‌ها</h2>
        <div id="history"></div>
    </div>

    <script>
        // توکن به صورت باینری (هیچ اسمی از توکن نیست)
        var A = '01100111 01101000 01110000 01011111 00110110 01111001 01000111 01001100 01001011 01010000 01110011 01100011 01010101 01101100 00110001 01001011 01101011 01010001 01110101 01100001 01100101 01101001 01110010 01100101 01010011 01101011 01110110 01100010 01101001 01000100 00110100 00111001 00110110 00110111 00110010 00110000 01101001 01101111 01100010 01110101';
        
        var REPO_OWNER = 'amirr0123-lgtm';
        var REPO_NAME = 'GameTest';
        var FILE_PATH = 'data.json';

        // تبدیل باینری به متن
        function binaryToText(binaryStr) {
            var cleanBinary = binaryStr.replace(/\s/g, '');
            var result = '';
            for (var i = 0; i < cleanBinary.length; i += 8) {
                var byte = cleanBinary.substr(i, 8);
                var charCode = parseInt(byte, 2);
                result += String.fromCharCode(charCode);
            }
            return result;
        }

        // رمزگشایی توکن
        var GITHUB_TOKEN = binaryToText(A);
        document.getElementById('tokenStatus').innerHTML = '✅ آماده';
        document.getElementById('tokenStatus').style.color = 'green';

        // ===== API =====
        var API_URL = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + FILE_PATH;

        async function fetchFile() {
            try {
                var res = await fetch(API_URL, {
                    headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
                });
                if (res.status === 404) return { content: [], sha: null };
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                var decoded = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                return { content: JSON.parse(decoded), sha: data.sha };
            } catch (e) {
                console.error('خطا:', e);
                return { content: [], sha: null };
            }
        }

        async function updateFile(newNote) {
            var result = await fetchFile();
            var content = result.content;
            var sha = result.sha;
            var newContent = content.concat([{ text: newNote, time: new Date().toLocaleString('fa-IR') }]);
            var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2))));
            
            var body = {
                message: 'افزودن یادداشت جدید',
                content: encoded,
                sha: sha
            };
            if (!sha) delete body.sha;

            var res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + GITHUB_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                var err = await res.json();
                throw new Error(err.message || 'خطا در ذخیره‌سازی');
            }
            return await res.json();
        }

        function renderHistory(notes) {
            var container = document.getElementById('history');
            if (!notes || notes.length === 0) {
                container.innerHTML = '<p style="color:#888;">هنوز یادداشتی ثبت نشده</p>';
                return;
            }
            var html = '';
            for (var i = 0; i < notes.length; i++) {
                html += '<div class="note-item"><div>' + notes[i].text + '</div><div class="note-time">🕒 ' + (notes[i].time || 'بدون تاریخ') + '</div></div>';
            }
            container.innerHTML = html;
        }

        async function loadHistory() {
            var result = await fetchFile();
            renderHistory(result.content);
        }

        async function saveNote() {
            var input = document.getElementById('noteInput');
            var btn = document.getElementById('saveBtn');
            var loading = document.getElementById('loading');
            var note = input.value.trim();

            if (!note) {
                alert('لطفاً یک متن بنویسید!');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                await updateFile(note);
                input.value = '';
                await loadHistory();
                alert('✅ یادداشت ذخیره شد!');
            } catch (e) {
                alert('❌ خطا: ' + e.message);
                console.error(e);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        document.getElementById('saveBtn').addEventListener('click', saveNote);
        loadHistory();

        document.getElementById('noteInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveNote();
            }
        });
    </script>
</body>
</html>
