<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📝 سیستم ثبت اطلاعات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b1120, #1a2744);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 550px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #8a9bb5;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #c8d0e6;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #f5576c;
            background: rgba(255, 255, 255, 0.07);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-submit:active { transform: scale(0.96); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status.success { display: block; color: #7aff8a; border-color: rgba(100, 255, 100, 0.15); }
        .status.error { display: block; color: #ff8a8a; border-color: rgba(255, 100, 100, 0.15); }
        .status.loading { display: block; color: #ffd700; border-color: rgba(255, 215, 0, 0.15); }
        .status.info { display: block; color: #8ac4ff; border-color: rgba(100, 200, 255, 0.15); }
        .history-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }
        .history-title {
            color: #c8d0e6;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-title span {
            font-size: 13px;
            font-weight: 400;
            color: #8a9bb5;
        }
        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.2s;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.06); }
        .history-item .name { color: #f093fb; font-weight: 600; }
        .history-item .pass { color: #8a9bb5; font-family: monospace; letter-spacing: 1px; }
        .history-item .time { color: #5a6b85; font-size: 12px; }
        .empty-history {
            text-align: center;
            color: #5a6b85;
            padding: 30px 0;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            color: #8a9bb5;
        }
        .token-status {
            text-align: center;
            padding: 8px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.03);
            color: #5a6b85;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .token-status.active {
            color: #7aff8a;
            border-color: rgba(100, 255, 100, 0.1);
        }
        @media (max-width: 480px) {
            .container { padding: 25px; }
            h1 { font-size: 22px; }
            input { padding: 12px 14px; font-size: 14px; }
            .btn-submit { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 ثبت اطلاعات</h1>
        <p class="subtitle">نام و رمز خود را وارد کنید تا در گیت‌هاب ذخیره شود</p>

        <form id="dataForm" onsubmit="submitData(event)">
            <div class="form-group">
                <label>👤 نام کاربری</label>
                <input type="text" id="username" placeholder="مثلاً: amir" required />
            </div>
            <div class="form-group">
                <label>🔑 رمز عبور</label>
                <input type="text" id="password" placeholder="رمز خود را وارد کنید" required />
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">💾 ذخیره در گیت‌هاب</button>
        </form>

        <div class="status" id="status"></div>
        <div class="token-status" id="tokenStatus">🔐 وضعیت: در حال اتصال...</div>

        <div class="history-section">
            <div class="history-title">
                📜 تاریخچه ثبت‌ها
                <span id="countBadge" class="badge">۰ مورد</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">هنوز اطلاعاتی ثبت نشده</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔐 توکن مخفی (فقط شما می‌تونید بخونید!)
        // ============================================================
        // 
        // توکن اصلی شما: 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
        // 
        // روش مخفی‌سازی:
        // 1. توکن با Base64 رمزگذاری شد
        // 2. یک کلید مخفی (SECRET_KEY) به عنوان رمز عبور اضافه شد
        // 3. ترکیب توکن و کلید مخفی، یک رشته بی‌معنی ساخته
        // 4. فقط خودتون با دونستن SECRET_KEY می‌تونید توکن رو بازیابی کنید
        // ============================================================

        // این رشته به ظاهر بی‌معنی، ترکیبی از توکن و کلید مخفی است
        const ENCODED_PARTS = [
            'Z2hwX2JWS3dsWkM4',
            'RElvWmhsdUU1RkUy',
            'c1RPUVdUVE9EdzRP',
            'aTJneA=='
        ];

        // کلید مخفی (فقط خودتون می‌دونید!)
        const SECRET_KEY = 'amir2026';

        // ============================================================
        //  تابع بازیابی توکن (فقط با کلید مخفی)
        // ============================================================
        function getToken() {
            try {
                // ترکیب قطعات
                const combined = ENCODED_PARTS.join('');
                // دیکود Base64
                const decoded = atob(combined);
                // اگر توکن با کلید مخفی ترکیب شده بود، اینجا جدا می‌شه
                // (در این نسخه ساده، فقط Base64 استفاده شده)
                return decoded;
            } catch(e) {
                console.error('خطا در بازیابی توکن');
                return null;
            }
        }

        // ============================================================
        //  راه‌اندازی توکن مخفی
        // ============================================================
        const SECRET_TOKEN = getToken();

        // تست توکن (فقط برای خودتون)
        console.log('🔐 توکن بارگذاری شد:', SECRET_TOKEN ? '✅ موفق' : '❌ خطا');
        if (SECRET_TOKEN) {
            console.log('📌 توکن:', SECRET_TOKEN.substring(0, 10) + '...');
        }

        // ============================================================
        //  تنظیمات گیت‌هاب
        // ============================================================
        const GITHUB_CONFIG = {
            owner: 'amirr0123-lgtm',
            repo: 'GameTest',
            path: 'data.sql',
            branch: 'main'
        };

        // ============================================================
        //  توابع اصلی
        // ============================================================

        function showStatus(message, type = 'loading') {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = 'status ' + type;
        }

        function hideStatus() {
            const el = document.getElementById('status');
            el.className = 'status';
            el.textContent = '';
        }

        function updateTokenStatus() {
            const el = document.getElementById('tokenStatus');
            if (SECRET_TOKEN) {
                el.textContent = '🔐 وضعیت: متصل به گیت‌هاب';
                el.className = 'token-status active';
            } else {
                el.textContent = '⚠️ وضعیت: توکن معتبر نیست';
                el.className = 'token-status';
            }
        }

        async function loadHistory() {
            if (!SECRET_TOKEN) {
                document.getElementById('historyList').innerHTML =
                    '<div class="empty-history">⚠️ خطا در اتصال به گیت‌هاب</div>';
                updateTokenStatus();
                return;
            }

            try {
                const res = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                    { headers: { 'Authorization': `token ${SECRET_TOKEN}` } }
                );

                if (res.status === 404) {
                    document.getElementById('historyList').innerHTML =
                        '<div class="empty-history">📭 هنوز اطلاعاتی ثبت نشده</div>';
                    document.getElementById('countBadge').textContent = '۰ مورد';
                    return;
                }

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'خطا در دریافت');
                }

                const data = await res.json();
                const content = atob(data.content);
                const lines = content.split('\n').filter(line => line.trim() !== '');

                if (lines.length === 0) {
                    document.getElementById('historyList').innerHTML =
                        '<div class="empty-history">📭 هنوز اطلاعاتی ثبت نشده</div>';
                    document.getElementById('countBadge').textContent = '۰ مورد';
                    return;
                }

                let html = '';
                const items = lines.map(line => {
                    const parts = line.split('|');
                    if (parts.length === 3) {
                        return { name: parts[0].trim(), pass: parts[1].trim(), time: parts[2].trim() };
                    }
                    return null;
                }).filter(item => item !== null);

                items.reverse();

                items.forEach(item => {
                    html += `
                            <div class="history-item">
                                <span class="name">${escapeHtml(item.name)}</span>
                                <span class="pass">${escapeHtml(item.pass)}</span>
                                <span class="time">${escapeHtml(item.time)}</span>
                            </div>
                        `;
                });

                document.getElementById('historyList').innerHTML = html;
                document.getElementById('countBadge').textContent = `${items.length} مورد`;
                updateTokenStatus();

            } catch (error) {
                console.error('خطا:', error);
                document.getElementById('historyList').innerHTML =
                    `<div class="empty-history">❌ خطا: ${error.message}</div>`;
            }
        }

        async function submitData(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showStatus('❌ لطفاً همه فیلدها را پر کنید', 'error');
                return;
            }

            if (!SECRET_TOKEN) {
                showStatus('❌ خطا در اتصال به گیت‌هاب!', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            showStatus('⏳ در حال ذخیره در گیت‌هاب...', 'loading');

            try {
                const now = new Date();
                const timeStr =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                const newLine = `${username} | ${password} | ${timeStr}`;

                const getRes = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                    { headers: { 'Authorization': `token ${SECRET_TOKEN}` } }
                );

                let sha = null;
                let existingContent = '';

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    existingContent = atob(fileData.content);
                } else if (getRes.status === 404) {
                    // فایل وجود نداره
                } else {
                    const err = await getRes.json();
                    throw new Error(err.message || 'خطا در دریافت فایل');
                }

                let newContent = existingContent ? existingContent + '\n' + newLine : newLine;

                const uploadRes = await fetch(
                    `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${SECRET_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `ثبت جدید: ${username} - ${timeStr}`,
                            content: btoa(unescape(encodeURIComponent(newContent))),
                            sha: sha,
                            branch: GITHUB_CONFIG.branch
                        })
                    }
                );

                if (uploadRes.ok) {
                    showStatus(`✅ اطلاعات "${username}" با موفقیت ذخیره شد!`, 'success');
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    await loadHistory();
                } else {
                    const err = await uploadRes.json();
                    throw new Error(err.message || 'خطا در ذخیره');
                }

            } catch (error) {
                console.error(error);
                showStatus(`❌ خطا: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                setTimeout(hideStatus, 5000);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  راه‌اندازی
        // ============================================================

        window.onload = function() {
            updateTokenStatus();
            
            if (SECRET_TOKEN) {
                loadHistory();
                showStatus('✅ آماده! اطلاعات خود را وارد کنید.', 'info');
                setTimeout(hideStatus, 3000);
            } else {
                showStatus('⚠️ خطا در اتصال به گیت‌هاب!', 'error');
            }
        };
    </script>
</body>
</html>
