<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادداشت‌ها</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; resize: vertical; }
        button { background: #2ea44f; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { opacity: 0.6; }
        .note-item { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-right: 4px solid #2ea44f; display: flex; justify-content: space-between; align-items: center; }
        .note-text { flex: 1; }
        .note-time { font-size: 12px; color: #666; margin-top: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #loading { text-align: center; color: #666; padding: 10px; display: none; }
        #history { margin-top: 15px; }
        #status { color: #666; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 یادداشت جدید</h2>
        <textarea id="noteInput" placeholder="متن یادداشت رو اینجا بنویس..."></textarea>
        <button id="saveBtn">💾 ذخیره</button>
        <div id="loading">⏳ در حال ذخیره‌سازی...</div>
        <div id="status"></div>
    </div>

    <div class="card">
        <h2>📜 تاریخچه</h2>
        <div id="history"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // ==========================================
        // تنظیمات Supabase (اینجا رو پر کن)
        // ==========================================
        const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co'; // 👈 آدرس پروژه رو بذار
        const SUPABASE_KEY = 'sb_publishable_OkiT5dLem6defhl9JVfigA_2oGRdWFc'; // 👈 کلید عمومی

        // ==========================================
        // اتصال به Supabase
        // ==========================================
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // بارگذاری یادداشت‌ها
        // ==========================================
        async function loadNotes() {
            try {
                const { data, error } = await supabase
                    .from('notes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderNotes(data);
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ ' + e.message;
                document.getElementById('status').style.color = 'red';
            }
        }

        // ==========================================
        // نمایش یادداشت‌ها
        // ==========================================
        function renderNotes(notes) {
            const container = document.getElementById('history');
            if (!notes || notes.length === 0) {
                container.innerHTML = '<p style="color:#888;">هنوز یادداشتی ثبت نشده</p>';
                return;
            }

            container.innerHTML = notes.map(n => `
                    <div class="note-item">
                        <div class="note-text">
                            <div>${n.content || n.text || 'بدون متن'}</div>
                            <div class="note-time">🕒 ${new Date(n.created_at).toLocaleString('fa-IR')}</div>
                        </div>
                        <button class="delete-btn" data-id="${n.id}">🗑️</button>
                    </div>
                `).join('');

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    if (confirm('حذف شود؟')) {
                        await deleteNote(this.dataset.id);
                    }
                });
            });
        }

        // ==========================================
        // اضافه کردن یادداشت
        // ==========================================
        async function addNote(content) {
            const { error } = await supabase
                .from('notes')
                .insert([{ content: content }]);

            if (error) throw error;
        }

        // ==========================================
        // حذف یادداشت
        // ==========================================
        async function deleteNote(id) {
            try {
                const { error } = await supabase
                    .from('notes')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                await loadNotes();
                alert('🗑️ حذف شد!');
            } catch (e) {
                alert('❌ خطا: ' + e.message);
            }
        }

        // ==========================================
        // ذخیره یادداشت جدید
        // ==========================================
        async function saveNote() {
            const input = document.getElementById('noteInput');
            const btn = document.getElementById('saveBtn');
            const loading = document.getElementById('loading');
            const content = input.value.trim();

            if (!content) {
                alert('متن بنویس!');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                await addNote(content);
                input.value = '';
                await loadNotes();
                alert('✅ ذخیره شد!');
            } catch (e) {
                alert('❌ خطا: ' + e.message);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // ==========================================
        // رویدادها
        // ==========================================
        document.getElementById('saveBtn').addEventListener('click', saveNote);
        document.getElementById('noteInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveNote();
            }
        });

        // ==========================================
        // اجرا
        // ==========================================
        loadNotes();
        document.getElementById('status').innerHTML = '✅ متصل به Supabase';
        document.getElementById('status').style.color = 'green';
    </script>
</body>
</html>
