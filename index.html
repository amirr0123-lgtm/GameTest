<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادداشت‌های گیت‌هاب</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        textarea { width: 100%; height: 120px; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; resize: vertical; }
        button { background: #2ea44f; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { opacity: 0.6; }
        .note-item { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-right: 4px solid #2ea44f; }
        .note-time { font-size: 12px; color: #666; margin-top: 5px; }
        #loading { text-align: center; color: #666; padding: 10px; display: none; }
        #history { margin-top: 15px; }
        #tokenStatus { color: #666; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 یادداشت جدید</h2>
        <textarea id="noteInput" placeholder="متن یادداشت رو اینجا بنویس..."></textarea>
        <button id="saveBtn">💾 ذخیره در گیت‌هاب</button>
        <div id="loading">⏳ در حال ذخیره‌سازی...</div>
        <div id="tokenStatus"></div>
    </div>

    <div class="card">
        <h2>📜 تاریخچه یادداشت‌ها</h2>
        <div id="history"></div>
    </div>

    <script>
        // ============================================
        // 1. توکن به صورت باینری (رمزگذاری شده)
        // ============================================
        const TOKEN_BINARY = '01100111 01101000 01110000 01011111 01000010 01001000 01111001 01110100 01000101 01001110 01001100 01010001 01100011 01011010 01100001 01010000 01010001 01110001 01000001 01110100 01101100 00111000 01101111 00110111 01100101 01001010 01110100 01100010 01011010 01001111 00111001 01010101 01010000 01000111 01111010 00110011 01001100 01010110 01001010 01101100 01101101';
        
        const REPO_OWNER = 'amirr0123-lgtm';
        const REPO_NAME = 'GameTest';
        const FILE_PATH = 'data.json';

        // ============================================
        // 2. مکانیسم تبدیل باینری به متن (داخلی)
        // ============================================
        function binaryToText(binaryStr) {
            const cleanBinary = binaryStr.replace(/\s/g, '');
            let result = '';
            for (let i = 0; i < cleanBinary.length; i += 8) {
                const byte = cleanBinary.substr(i, 8);
                const charCode = parseInt(byte, 2);
                result += String.fromCharCode(charCode);
            }
            return result;
        }

        // ============================================
        // 3. مکانیسم Base64 سفارشی (بدون btoa/atob)
        // ============================================
        const BASE64_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

        function stringToBase64(str) {
            // تبدیل رشته به UTF-8 بایت‌ها
            const utf8Bytes = [];
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i);
                if (charCode < 128) {
                    utf8Bytes.push(charCode);
                } else if (charCode < 2048) {
                    utf8Bytes.push(192 | (charCode >> 6));
                    utf8Bytes.push(128 | (charCode & 63));
                } else if (charCode < 65536) {
                    utf8Bytes.push(224 | (charCode >> 12));
                    utf8Bytes.push(128 | ((charCode >> 6) & 63));
                    utf8Bytes.push(128 | (charCode & 63));
                } else {
                    utf8Bytes.push(240 | (charCode >> 18));
                    utf8Bytes.push(128 | ((charCode >> 12) & 63));
                    utf8Bytes.push(128 | ((charCode >> 6) & 63));
                    utf8Bytes.push(128 | (charCode & 63));
                }
            }

            // تبدیل به Base64
            let result = '';
            for (let i = 0; i < utf8Bytes.length; i += 3) {
                const a = utf8Bytes[i];
                const b = utf8Bytes[i + 1] || 0;
                const c = utf8Bytes[i + 2] || 0;
                
                const idx1 = a >> 2;
                const idx2 = ((a & 3) << 4) | (b >> 4);
                const idx3 = ((b & 15) << 2) | (c >> 6);
                const idx4 = c & 63;
                
                result += BASE64_CHARS[idx1] + BASE64_CHARS[idx2];
                result += (i + 1 < utf8Bytes.length) ? BASE64_CHARS[idx3] : '=';
                result += (i + 2 < utf8Bytes.length) ? BASE64_CHARS[idx4] : '=';
            }
            return result;
        }

        function base64ToString(base64) {
            // حذف کاراکترهای =
            base64 = base64.replace(/=+$/, '');
            
            // تبدیل Base64 به بایت‌ها
            const bytes = [];
            for (let i = 0; i < base64.length; i += 4) {
                const idx1 = BASE64_CHARS.indexOf(base64[i]);
                const idx2 = BASE64_CHARS.indexOf(base64[i + 1]);
                const idx3 = BASE64_CHARS.indexOf(base64[i + 2]);
                const idx4 = BASE64_CHARS.indexOf(base64[i + 3]);
                
                const byte1 = (idx1 << 2) | (idx2 >> 4);
                const byte2 = ((idx2 & 15) << 4) | (idx3 >> 2);
                const byte3 = ((idx3 & 3) << 6) | idx4;
                
                bytes.push(byte1);
                if (idx3 !== -1) bytes.push(byte2);
                if (idx4 !== -1) bytes.push(byte3);
            }

            // تبدیل بایت‌های UTF-8 به رشته
            let result = '';
            let i = 0;
            while (i < bytes.length) {
                const byte1 = bytes[i];
                if (byte1 < 128) {
                    result += String.fromCharCode(byte1);
                    i++;
                } else if (byte1 >= 192 && byte1 < 224) {
                    const byte2 = bytes[i + 1];
                    result += String.fromCharCode(((byte1 & 31) << 6) | (byte2 & 63));
                    i += 2;
                } else if (byte1 >= 224 && byte1 < 240) {
                    const byte2 = bytes[i + 1];
                    const byte3 = bytes[i + 2];
                    result += String.fromCharCode(((byte1 & 15) << 12) | ((byte2 & 63) << 6) | (byte3 & 63));
                    i += 3;
                } else {
                    const byte2 = bytes[i + 1];
                    const byte3 = bytes[i + 2];
                    const byte4 = bytes[i + 3];
                    const charCode = ((byte1 & 7) << 18) | ((byte2 & 63) << 12) | ((byte3 & 63) << 6) | (byte4 & 63);
                    result += String.fromCharCode(charCode);
                    i += 4;
                }
            }
            return result;
        }

        // ============================================
        // 4. رمزگشایی توکن
        // ============================================
        let GITHUB_TOKEN;
        try {
            GITHUB_TOKEN = binaryToText(TOKEN_BINARY);
            document.getElementById('tokenStatus').innerHTML = '✅ توکن با موفقیت رمزگشایی شد';
            document.getElementById('tokenStatus').style.color = 'green';
        } catch (e) {
            document.getElementById('tokenStatus').innerHTML = '❌ خطا: ' + e.message;
            document.getElementById('tokenStatus').style.color = 'red';
            throw e;
        }

        // ============================================
        // 5. بقیه کدها (با توابع جدید)
        // ============================================
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        async function fetchFile() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (res.status === 404) return { content: [], sha: null };
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const decoded = base64ToString(data.content.replace(/\s/g, ''));
                return { content: JSON.parse(decoded), sha: data.sha };
            } catch (e) {
                console.error('خطا در خواندن فایل:', e);
                return { content: [], sha: null };
            }
        }

        async function updateFile(newNote) {
            const { content, sha } = await fetchFile();
            const newContent = [...content, { text: newNote, time: new Date().toLocaleString('fa-IR') }];
            const encoded = stringToBase64(JSON.stringify(newContent, null, 2));
            
            const body = {
                message: `افزودن یادداشت جدید`,
                content: encoded,
                sha: sha
            };
            if (!sha) delete body.sha;

            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'خطا در ذخیره‌سازی');
            }
            return await res.json();
        }

        function renderHistory(notes) {
            const container = document.getElementById('history');
            if (!notes || notes.length === 0) {
                container.innerHTML = '<p style="color:#888;">هنوز یادداشتی ثبت نشده</p>';
                return;
            }
            container.innerHTML = notes.map(n => `
                <div class="note-item">
                    <div>${n.text}</div>
                    <div class="note-time">🕒 ${n.time || 'بدون تاریخ'}</div>
                </div>
            `).join('');
        }

        async function loadHistory() {
            const { content } = await fetchFile();
            renderHistory(content);
        }

        async function saveNote() {
            const input = document.getElementById('noteInput');
            const btn = document.getElementById('saveBtn');
            const loading = document.getElementById('loading');
            const note = input.value.trim();

            if (!note) {
                alert('لطفاً یک متن بنویسید!');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                await updateFile(note);
                input.value = '';
                await loadHistory();
                alert('✅ یادداشت با موفقیت ذخیره شد!');
            } catch (e) {
                alert('❌ خطا: ' + e.message);
                console.error(e);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        document.getElementById('saveBtn').addEventListener('click', saveNote);
        loadHistory();

        document.getElementById('noteInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                saveNote();
            }
        });
    </script>
</body>
</html>
