<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 چت عمومی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #e8f0fe, #d4e4f7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15);
            border: 1px solid rgba7/29/2026 14:57:55	9 آذر 1406	1:27	سلام	هیهینینینیههین																					(255, 255, 255, 0.3);
        }
        .chat-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4e0ed;
            margin-bottom: 20px;
        }
        .chat-header h1 {
            color: #1a3a5c;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .chat-header p {
            color: #4a6a8a;
            font-size: 0.9rem;
        }
        .login-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .login-section input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #c0d0e0;
            border-radius: 30px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            background: #f8faff;
        }
        .login-section input:focus {
            outline: none;
            border-color: #4a8ab5;
            box-shadow: 0 0 0 4px rgba(74, 138, 181, 0.1);
        }
        .login-section button {
            padding: 12px 30px;
            background: #1a5a7a;
            color: white;
            border: none;
            border-radius: 30px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-section button:hover {
            background: #0e3d5a;
            transform: scale(1.02);
        }
        .chat-box {
            background: #f2f7fc;
            border-radius: 20px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #dce8f2;
        }
        .message-item {
            background: white;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-right: 4px solid #4a8ab5;
        }
        .message-item .username {
            font-weight: 700;
            color: #1a3a5c;
            font-size: 0.95rem;
        }
        .message-item .time {
            float: left;
            color: #7a8a9a;
            font-size: 0.75rem;
            background: #eef4f9;
            padding: 2px 10px;
            border-radius: 30px;
        }
        .message-item .text {
            margin-top: 6px;
            color: #2a3a4a;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .message-item .date {
            color: #7a8a9a;
            font-size: 0.7rem;
            margin-top: 4px;
        }
        .input-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-section input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #c0d0e0;
            border-radius: 30px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            background: #f8faff;
        }
        .input-section input:focus {
            outline: none;
            border-color: #4a8ab5;
            box-shadow: 0 0 0 4px rgba(74, 138, 181, 0.1);
        }
        .input-section button {
            padding: 12px 30px;
            background: #4a8ab5;
            color: white;
            border: none;
            border-radius: 30px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-section button:hover {
            background: #2a6a8a;
            transform: scale(1.02);
        }
        .input-section button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            color: #4a6a8a;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 24px;
        }
        .empty-chat {
            text-align: center;
            color: #7a8a9a;
            padding: 40px 0;
        }
        @media (max-width: 600px) {
            .login-section, .input-section {
                flex-direction: column;
            }
            .login-section button, .input-section button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 چت عمومی</h1>
            <p>گفت‌وگوی آزاد و دوستانه</p>
        </div>

        <!-- بخش ورود / تعیین نام -->
        <div id="loginArea" class="login-section">
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کنید..." maxlength="20">
            <button id="loginBtn">✅ ورود به چت</button>
        </div>

        <!-- بخش چت (پس از ورود) -->
        <div id="chatArea" style="display: none;">
            <div class="chat-box" id="chatBox">
                <div class="empty-chat">در حال بارگذاری پیام‌ها...</div>
            </div>

            <div class="input-section">
                <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="500">
                <button id="sendBtn">📤 ارسال</button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        // شناسه Deployment شما
        const DEPLOYMENT_ID = "AKfycbxrqOK0z97ZQmee7DEh0P5hWahw6VumgixKizSFV-8gZujQLceNTyn5cu6yY1q_d9A3";
        const SCRIPT_URL = `https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec`;

        // عناصر DOM
        const loginArea = document.getElementById('loginArea');
        const chatArea = document.getElementById('chatArea');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const status = document.getElementById('status');

        let currentUsername = '';
        let isLoading = false;
        let loadInterval = null;

        // --- ورود به چت ---
        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) {
                status.textContent = '⚠️ لطفاً نام خود را وارد کنید.';
                return;
            }
            currentUsername = name;
            loginArea.style.display = 'none';
            chatArea.style.display = 'block';
            status.textContent = `👤 خوش آمدید، ${currentUsername}!`;
            
            // ذخیره نام در localStorage
            localStorage.setItem('chat_username', currentUsername);
            
            // بارگذاری پیام‌ها
            loadMessages();
            
            // بارگذاری خودکار هر 3 ثانیه
            if (loadInterval) clearInterval(loadInterval);
            loadInterval = setInterval(loadMessages, 3000);
        });

        // با Enter در فیلد نام
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // --- ارسال پیام ---
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            if (!currentUsername) {
                status.textContent = '⚠️ ابتدا وارد شوید.';
                return;
            }

            sendBtn.disabled = true;
            status.textContent = '⏳ در حال ارسال...';

            const data = {
                username: currentUsername,
                message: text
            };

            // استفاده از google.script.run (در محیط Apps Script)
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((response) => {
                        if (response.success) {
                            messageInput.value = '';
                            status.textContent = '✅ پیام ارسال شد!';
                            loadMessages();
                        } else {
                            status.textContent = '❌ ' + response.message;
                        }
                        sendBtn.disabled = false;
                    })
                    .withFailureHandler((error) => {
                        status.textContent = '❌ خطا: ' + error;
                        sendBtn.disabled = false;
                    })
                    .sendMessage(data);
            } else {
                // Fallback: استفاده از fetch
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(data)
                })
                .then(() => {
                    messageInput.value = '';
                    status.textContent = '✅ پیام ارسال شد!';
                    loadMessages();
                    sendBtn.disabled = false;
                })
                .catch((error) => {
                    status.textContent = '❌ خطا: ' + error;
                    sendBtn.disabled = false;
                });
            }
        }

        // --- دریافت و نمایش پیام‌ها ---
        function loadMessages() {
            if (isLoading) return;
            isLoading = true;

            // ابتدا پیام "در حال بارگذاری..." را نمایش بده
            if (chatBox.children.length === 0) {
                chatBox.innerHTML = '<div class="empty-chat">⏳ در حال بارگذاری...</div>';
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((messages) => {
                        displayMessages(messages);
                        isLoading = false;
                    })
                    .withFailureHandler((error) => {
                        console.error('Error loading messages:', error);
                        status.textContent = '❌ خطا در دریافت پیام‌ها: ' + error;
                        chatBox.innerHTML = '<div class="empty-chat">❌ خطا در دریافت پیام‌ها</div>';
                        isLoading = false;
                    })
                    .getChatHistory();
            } else {
                // Fallback: fetch
                fetch(`${SCRIPT_URL}?action=getHistory`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(messages => {
                        displayMessages(messages);
                        isLoading = false;
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        status.textContent = '❌ خطا در دریافت پیام‌ها';
                        chatBox.innerHTML = '<div class="empty-chat">❌ خطا در دریافت پیام‌ها</div>';
                        isLoading = false;
                    });
            }
        }

        function displayMessages(messages) {
            chatBox.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                chatBox.innerHTML = '<div class="empty-chat">💬 پیامی وجود ندارد. اولین نفر باشید! 🎉</div>';
                return;
            }

            messages.forEach(msg => {
                // ساختار: [تاریخ میلادی, تاریخ شمسی, ساعت, نام, پیام]
                const date = msg[1] || 'تاریخ نامشخص';
                const time = msg[2] || '';
                const username = msg[3] || 'ناشناس';
                const text = msg[4] || '';

                const item = document.createElement('div');
                item.className = 'message-item';
                item.innerHTML = `
                    <div>
                        <span class="username">${escapeHtml(username)}</span>
                        <span class="time">🕐 ${escapeHtml(time)}</span>
                    </div>
                    <div class="text">${escapeHtml(text)}</div>
                    <div class="date">📅 ${escapeHtml(date)}</div>
                `;
                chatBox.appendChild(item);
            });

            // اسکرول به پایین
            chatBox.scrollTop = chatBox.scrollHeight;
            status.textContent = `✅ ${messages.length} پیام بارگذاری شد`;
        }

        // تابع امنیتی برای جلوگیری از XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // بارگذاری اولیه (اگر قبلاً وارد شده باشد)
        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('chat_username');
            if (savedName) {
                usernameInput.value = savedName;
                // با تاخیر کوچک وارد شو
                setTimeout(() => loginBtn.click(), 100);
            }
        });

        // پاک کردن interval در صورت بسته شدن صفحه
        window.addEventListener('beforeunload', () => {
            if (loadInterval) clearInterval(loadInterval);
        });
    </script>
</body>
</html>
